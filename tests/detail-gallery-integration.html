<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="stylesheet" href="../site.css"><style>body{padding:20px}.detail-layout{max-width:1100px;margin:auto}#result{white-space:pre-wrap}</style><body class="pv-redesign"><div id="app"><div class="detail-layout"><article class="detail-main"><div class="detail-topline">სამუშაოს შეთავაზება</div><h1>ფოტოგალერეის ადგილობრივი მაგალითი</h1><div class="meta">თბილისი</div><div class="detail-meta"><div><small>ანაზღაურება</small><strong>შეთანხმებით</strong></div></div><h3>სამუშაოს აღწერა</h3><p>ეს მხოლოდ საცდელი გვერდია. მონაცემები არ იგზავნება ბაზაში.</p></article><aside class="profile-box"><h3>საკონტაქტო ინფორმაცია</h3><p>ავტორის ინფორმაცია უცვლელია.</p></aside></div></div><pre id="result">მოწმდება…</pre><script>
const q=new URLSearchParams(location.search),kind=q.get('kind')||'jobs',n=Number(q.get('count')??5),id='11111111-1111-4111-8111-111111111111';
if(kind==='workers'){document.querySelector('.detail-topline').textContent='სამუშაოს მაძიებელი';document.querySelector('.detail-main h3').textContent='უნარები';}
location.hash=(kind==='jobs'?'#/job/':'#/worker/')+id;
window.Pove24Store={accountRef:()=>null,resolveId:()=>id,client:{from:()=>{const query={select:()=>query,eq:()=>query,order:()=>query,limit:async()=>({data:Array.from({length:n},(_,i)=>({id:'p'+i,position:i,storage_path:'photo-'+(i+1)+'.png'}))})};return query;}}};
window.PoveListingPhotoCore={repository:()=>({preview:async path=>new URL(path,location.href).href})};
</script><script src="../detail-gallery.js"></script><script>setTimeout(()=>{const gallery=document.querySelector('.pv-detail-gallery');const ok=n?gallery&&document.querySelector('.pv-gallery-host').nextElementSibling.tagName==='H3':!gallery;document.getElementById('result').textContent=(ok?'PASS ':'FAIL ')+kind+' detail integration; '+n+' photos; gallery before first content heading';document.title=ok?'PASS detail integration':'FAIL detail integration';},300);</script></body></html>
