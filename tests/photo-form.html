<!doctype html><html lang="ka"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LOCAL TEST ONLY — photo form</title><link rel="stylesheet" href="../site.css"><style>body.pv-redesign{padding:20px 12px}#app.container{width:100%;max-width:760px;margin:auto;padding:0}#app h1{font-size:22px;margin:0 0 10px}#app>p{font-size:12px}#test-form .form-shell{margin:20px 0;padding:20px;max-width:none}#test-form form>input{display:none}#test-form .form-submit{margin-top:12px}#show-job,#show-worker{min-height:44px;margin:4px;padding:8px}#test-result{display:block}</style><body class="pv-redesign"><main id="app" class="container"><h1>იზოლირებული ფოტო-ტესტი</h1><p>მხოლოდ მეხსიერება. Supabase არ გამოიყენება.</p><button id="show-job">სამუშაოს შეთავაზება</button><button id="show-worker">სამუშაოს მაძიებელი</button><button id="add-synthetic" type="button">სინთეზური ფოტოს დამატება</button><output id="test-result"></output><div id="test-form"></div></main>
<script>
const rows={jobs:[],workers:[]};let jobs=[];const selections=[{main:'სილამაზე და თავის მოვლა',sub:'მაკიაჟი და ვიზაჟი'}];
const categoryPickerSelections=()=>selections,workerSkillEntriesFromForm=()=>selections;
function notify(message){document.querySelector('#test-result').textContent=message;}
let files=new Map(),attached=[],saveCalls=0;
window.Pove24Store={authUser:{email:'isolated@example.invalid'},accountRef:()=> 'isolated-owner',sameUser:x=>x==='isolated@example.invalid',resolveId:(k,id)=>id,get:(key,fallback)=>key==='dge-jobs'?rows.jobs:key==='dge-workers'?rows.workers:fallback,validateCategorySelections:()=>selections,
 saveFormListing:async(kind,row)=>{saveCalls++;await new Promise(r=>setTimeout(r,150));row.uuid=row.pendingUuid||row.uuid;rows[kind]=[row];return row;},
 client:{rpc:async(name,args)=>{if(name==='reserve_listing_photo'){const id=crypto.randomUUID();return {data:{id,storage_path:id+'.webp'}};}if(name==='listing_photo_manifest')return {data:attached};if(name==='commit_listing_photos'){attached=args.p_selected.map(id=>({id,storage_path:id+'.webp'}));return {data:attached};}},storage:{from:()=>({upload:async(path,blob)=>{files.set(path,blob);return {data:{}};},createSignedUrl:async(path)=>({data:{signedUrl:URL.createObjectURL(files.get(path))}}),remove:async()=>({data:{}})})},from:()=>({select:()=>({eq:()=>({eq:()=>({limit:async()=>({data:[]})})})})})}};
</script><script src="../listing-photos-core.js"></script><script src="../listing-photos.js"></script><script>
function show(kind){location.hash='test-'+kind;attached=[];document.querySelector('#test-form').innerHTML='<form id="'+(kind==='jobs'?'postForm':'workerProfileForm')+'" class="form-shell"><div id="cat-post-category"></div><input name="name" value="იზოლირებული ტესტი"><input name="title" value="იზოლირებული ტესტი"><input name="offer" value="იზოლირებული ტესტი"><input name="city" value="თბილისი"><input name="paymentType" value="negotiable"><input name="dateMode" value="agreement"><input name="hasExperience" value="no"><input name="about" value="იზოლირებული სატესტო აღწერა"><input name="description" value="იზოლირებული სატესტო აღწერა">'+PoveListingPhotos.field()+'<button type="submit" class="btn form-submit">ტესტის შენახვა</button></form>';}
document.querySelector('#show-job').onclick=()=>show('jobs');
document.querySelector('#show-worker').onclick=()=>show('workers');document.addEventListener('submit',e=>{e.preventDefault();PoveListingPhotos.submit(e.target);});show('jobs');
document.querySelector('#add-synthetic').onclick=async()=>{const canvas=document.createElement('canvas');canvas.width=240;canvas.height=180;const ctx=canvas.getContext('2d');ctx.fillStyle='#698a60';ctx.fillRect(0,0,240,180);const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));const input=document.querySelector('[data-listing-photo-input]');if(input.disabled){notify('არჩევა გამორთულია');return;}const transfer=new DataTransfer();transfer.items.add(new File([blob],'synthetic.png',{type:'image/png'}));input.files=transfer.files;input.dispatchEvent(new Event('change',{bubbles:true}));};
</script></body></html>
